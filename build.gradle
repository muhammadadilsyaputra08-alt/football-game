buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
    }
}

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    version = '0.1.0-alpha'
    ext {
        appName = 'PixelSoccerCozy'
        gdxVersion = '1.12.1'
        roboVMVersion = '2.3.20'
        box2DLightsVersion = '1.5'
        ashleyVersion = '1.7.4'
        aiVersion = '1.8.2'
        gdxControllersVersion = '2.2.3'
    }

    repositories {
        mavenCentral()
        google()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    }
}

project(':core') {
    apply plugin: 'java-library'

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        // Optional: LuaJ for runtime Lua scripts
        // implementation 'org.luaj:luaj-jse:3.0.1'
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets.main.java.srcDirs = ['src/']
    sourceSets.main.resources.srcDirs = ['assets/']
}

project(':desktop') {
    apply plugin: 'java-library'
    apply plugin: 'java'

    dependencies {
        implementation project(':core')
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets.main.java.srcDirs = ['src/']
    sourceSets.main.resources.srcDirs = ['../assets/']

    // Task untuk menjalankan desktop
    tasks.register('run', JavaExec) {
        dependsOn classes
        mainClass = 'com.cozypixel.soccer.DesktopLauncher'
        classpath = sourceSets.main.runtimeClasspath
        standardInput = System.in
        workingDir = project(':core').projectDir
        ignoreExitValue = true
    }

    // Package jar
    tasks.register('dist', Jar) {
        // FIX: runtimeClasspath memuat core-<ver>.jar; jar itu harus dibangun
        // lebih dulu (sebelumnya hanya `classes` => "Cannot expand ZIP ... core-0.1.0-alpha.jar").
        dependsOn classes, ':core:jar'
        archiveBaseName = project.ext.appName
        archiveVersion = project.version
        from files(sourceSets.main.output.classesDirs)
        from files(sourceSets.main.output.resourcesDir)
        from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        zip64 = true
        manifest {
            attributes 'Main-Class': 'com.cozypixel.soccer.DesktopLauncher'
        }
    }
}

project(':android') {
    apply plugin: 'com.android.application'

    configurations { natives }

    android {
        namespace 'com.cozypixel.soccer'
        compileSdk 34
        sourceSets {
            main {
                manifest.srcFile 'AndroidManifest.xml'
                java.srcDirs = ['src']
                res.srcDirs = ['res']
                assets.srcDirs = ['../assets']
                jniLibs.srcDirs = ['libs']
            }
        }
        defaultConfig {
            applicationId 'com.cozypixel.soccer'
            minSdk 21
            targetSdk 34
            versionCode 1
            versionName '0.1.0-alpha'
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
        buildTypes {
            release {
                minifyEnabled false
            }
        }
        packaging {
            resources {
                excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
            }
        }
    }

    dependencies {
        implementation project(':core')
        implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
    }

    // Copy natives
    tasks.register('copyAndroidNatives') {
        doFirst {
            file('libs/armeabi-v7a/').mkdirs()
            file('libs/arm64-v8a/').mkdirs()
            file('libs/x86/').mkdirs()
            file('libs/x86_64/').mkdirs()
            configurations.natives.copy().files.each { jar ->
                def outputDir = null
                if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
                if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
                if (jar.name.endsWith('natives-x86.jar')) outputDir = file('libs/x86')
                if (jar.name.endsWith('natives-x86_64.jar')) outputDir = file('libs/x86_64')
                if (outputDir != null) {
                    copy {
                        from zipTree(jar)
                        into outputDir
                        include '*.so'
                    }
                }
            }
        }
    }
    tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
        dependsOn 'copyAndroidNatives'
    }
}

tasks.register('cleanAll', Delete) {
    delete rootProject.layout.buildDirectory
    delete 'core/build'
    delete 'desktop/build'
    delete 'android/build'
}
